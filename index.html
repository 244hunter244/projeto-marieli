<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sandbox 3D</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="error-box" style="display:none;"></div>
  <div id="crosshair">+</div>

  <div id="ui">
    <h1>🌲 Sandbox 3D</h1>
    <p><b>Controles:</b> Clique para Jogar | WASD para Andar | Espaço para Pular | Shift para Correr</p>
    <div id="stats">A carregar o mundo...</div>
  </div>

  <script>
    window.logGameError = function(contexto, erro) {
      console.error(`❌ [${contexto}]:`, erro);
      const errBox = document.getElementById('error-box');
      if (errBox) {
        errBox.style.display = 'block';
        errBox.innerHTML = `<b>❌ ERRO EM [${contexto}]:</b><br>${erro.message || erro}`;
      }
    };
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
